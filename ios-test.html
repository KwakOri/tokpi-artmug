<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>아이폰 테두리 이미지 시험</title>
<style>
body{margin:0;padding:12px;font:15px/1.4 -apple-system,sans-serif;background:#8a6d5a;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cell b{display:block;margin-bottom:6px}
.box{position:relative;height:70px;z-index:0}
.t::after{content:"";position:absolute;inset:0;z-index:-2;box-sizing:border-box;border:30px solid transparent;
 border-image-source:url("https://storage.tokpi.shop/assets/ffd3d713-3084-4394-a6f4-f656beaeb898/4b2afb04bc8e4c33.png");
 border-image-slice:25% fill;border-image-width:30px;border-image-repeat:round;will-change:transform}
.B::after{border-image-repeat:stretch}
.C::after{will-change:auto}
.D::after{border-image-slice:60 fill}
.E::after{border-image-source:url(assets/test-frame.png)}
.F::after{border-image-repeat:repeat}
.G::after{z-index:0}
.H::after{border-image-slice:60 fill;border-image-repeat:stretch;will-change:auto}
</style></head><body>
<p>칸마다 테두리(검은 선, 모서리 분홍 삼각형, 흰 바탕)가 보이는지 확인용이에요.</p>
<div class="grid">
<div class="cell"><b>A 원래 그대로</b><div class="box t"></div></div>
<div class="cell"><b>B stretch</b><div class="box t B"></div></div>
<div class="cell"><b>C will-change 없음</b><div class="box t C"></div></div>
<div class="cell"><b>D slice 숫자</b><div class="box t D"></div></div>
<div class="cell"><b>E 같은 주소 이미지</b><div class="box t E"></div></div>
<div class="cell"><b>F repeat</b><div class="box t F"></div></div>
<div class="cell"><b>G z-index 0</b><div class="box t G"></div></div>
<div class="cell"><b>H 숫자+stretch</b><div class="box t H"></div></div>
</div></body></html>
