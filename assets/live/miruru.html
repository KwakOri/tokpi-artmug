#page_wrap .page_area.chat { box-sizing: border-box; padding: 10px; }
#page_wrap .page_area.chat .chat_area { width: calc(100% + 10px); margin: 0 -5px; }

#page_wrap .chat_box p { margin: 0; }
#page_wrap .chat_box p.name, #page_wrap .chat_box p.text { text-shadow: 0.05em 0 #000d, -0.05em 0 #000d, 0 0.05em #000d, 0 -0.05em #000d; }

#page_wrap .page_area.chat.item_chat_align_normal .chat_box p.name { float: left; margin-right: .3em; }
#page_wrap .page_area.chat.item_chat_randomcolor .chat_box.color_0 p.name { color: #9f7eb7 !important; }
#page_wrap .page_area.chat.item_chat_randomcolor .chat_box.color_1 p.name { color: #d889ae !important; }
#page_wrap .page_area.chat.item_chat_fadeout .chat_area { mask-image: linear-gradient(to top, #000 70%, transparent); }
#page_wrap .icon_platform, #page_wrap .icon_badge { display: inline-block; background-repeat: no-repeat; background-position: center; background-size: contain; }
#page_wrap .icon_platform { width: 1.1em; height: 1.1em; vertical-align: middle; }
#page_wrap .icon_badge { width: .9em; height: .9em; }

#page_wrap .chat_list > .fx { position: relative; isolation: isolate; align-self: stretch; display: flex; flex-direction: column; align-items: center; flex: none; animation: fx-land .9s cubic-bezier(.2,1.4,.4,1) both; }
.fx-glow { position: absolute; z-index: -1; left: -4%; right: -4%; top: 4%; bottom: -14%; border-radius: 50%; background: radial-gradient(closest-side, rgba(255,150,210,.95), rgba(255,120,190,.35) 70%, rgba(255,120,190,0)); opacity: 0; animation: fx-glow 2.4s .5s ease-in-out 2 both; pointer-events: none; }
.fx-shine { position: absolute; left: 13%; right: 13%; top: 46px; bottom: 16px; border-radius: 22px; overflow: hidden; pointer-events: none; mix-blend-mode: screen; }
.fx-shine::before { content: ""; position: absolute; top: -20%; bottom: -20%; width: 34%; left: 0; background: linear-gradient(100deg, transparent, rgba(255,255,255,.9), transparent); transform: translateX(-120%) skewX(-18deg); animation: fx-shine .75s .75s ease-in-out both; }
.fx-burst { position: absolute; left: 50%; top: 52%; width: 0; height: 0; pointer-events: none; }
.fx-burst i { position: absolute; left: -14px; top: -17px; font: 700 30px/34px sans-serif; font-style: normal; color: #fff; text-shadow: 0 0 6px #ff7fc0, 0 0 2px #ff3d95; opacity: 0; animation: fx-burst 1s .3s cubic-bezier(.15,.8,.3,1) both; }
.fx-burst i:nth-child(3n) { color: #ffe36e; text-shadow: 0 0 6px #ffb300; }
.fx-burst i:nth-child(3n+1) { color: #ff9ccc; }
.fx .msg_box > p.val, .fx .text_box > p.msg .val { display: inline-block; animation: fx-pop .55s 1s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes fx-land { 0% { opacity: 0; transform: translateY(-46px) scale(1.18) rotate(-4deg); } 38% { opacity: 1; transform: translateY(0) scale(.96) rotate(1.5deg); } 52% { transform: rotate(-1.5deg) scale(1.01); } 66% { transform: rotate(1deg); } 80% { transform: rotate(-.5deg); } 100% { opacity: 1; transform: none; } }
@keyframes fx-glow { 0%, 100% { opacity: 0; transform: scale(.9); } 50% { opacity: 1; transform: scale(1.05); } }
@keyframes fx-shine { from { transform: translateX(-120%) skewX(-18deg); } to { transform: translateX(330%) skewX(-18deg); } }
@keyframes fx-burst { 0% { opacity: 0; transform: translate(0,0) scale(.3) rotate(0); } 12% { opacity: 1; } 65% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--x), var(--y)) scale(1) rotate(var(--r)); } }
