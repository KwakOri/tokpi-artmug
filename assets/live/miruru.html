#page_wrap .page_area.chat { box-sizing: border-box; padding: 10px; }
#page_wrap .page_area.chat .chat_area { width: calc(100% + 10px); margin: 0 -5px; }

#page_wrap .chat_box p { margin: 0; }
#page_wrap .chat_box p.name, #page_wrap .chat_box p.text { text-shadow: 0.05em 0 #000d, -0.05em 0 #000d, 0 0.05em #000d, 0 -0.05em #000d; }

#page_wrap .page_area.chat.item_chat_align_normal .chat_box p.name { float: left; margin-right: .3em; }
#page_wrap .page_area.chat.item_chat_randomcolor .chat_box.color_0 p.name { color: #9f7eb7 !important; }
#page_wrap .page_area.chat.item_chat_randomcolor .chat_box.color_1 p.name { color: #d889ae !important; }
#page_wrap .page_area.chat.item_chat_fadeout .chat_area { mask-image: linear-gradient(to top, #000 70%, transparent); }
#page_wrap .icon_platform, #page_wrap .icon_badge { display: inline-block; background-repeat: no-repeat; background-position: center; background-size: contain; }
#page_wrap .icon_platform { width: 1.1em; height: 1.1em; vertical-align: middle; }
#page_wrap .icon_badge { width: .9em; height: .9em; }
